name: Create version tag

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  tag-version:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run test suite
        run: make test

      - name: Create semantic version tag
        shell: bash
        run: |
          set -euo pipefail

          latest_tag="$(git tag --list 'v[0-9]*' --sort=-version:refname | head -n 1)"
          if [ -n "$latest_tag" ]; then
            commit_range="${latest_tag}..${GITHUB_SHA}"
          else
            latest_tag="v0.0.0"
            commit_range="${GITHUB_SHA}"
          fi

          subjects="$(git log --format=%s "$commit_range")"
          if printf '%s\n' "$subjects" | grep -Eiq '^[[:space:]]*feat([(:[:space:]-]|$)'; then
            bump="minor"
          elif printf '%s\n' "$subjects" | grep -Eiq '^[[:space:]]*(refactor|fix|bugfix)([(:[:space:]-]|$)'; then
            bump="patch"
          else
            echo "No versionable commit found."
            exit 0
          fi

          version="${latest_tag#v}"
          IFS='.' read -r major minor patch <<< "$version"
          case "$bump" in
            minor)
              minor=$((minor + 1))
              patch=0
              ;;
            patch)
              patch=$((patch + 1))
              ;;
          esac

          new_tag="v${major}.${minor}.${patch}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$new_tag" -m "Release $new_tag" "$GITHUB_SHA"
          git push origin "$new_tag"
