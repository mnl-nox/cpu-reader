name: Continuous integration

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  core:
    name: ${{ matrix.compiler }} / native
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
      env:
      CC: ${{ matrix.compiler }}
    steps:
      - uses: actions/checkout@v4
      - name: Install compiler
        if: matrix.compiler == 'clang'
        run: sudo apt-get update && sudo apt-get install -y clang
      - name: Build and test
        run: make test

  quality:
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: [test-sanitize, test-security]
    steps:
      - uses: actions/checkout@v4
      - name: Run quality check
        run: make ${{ matrix.check }}

  arm64:
    name: gcc / arm64 runtime
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        run: make test
      - name: Run benchmark (informational)
        run: make benchmark
