name: Continuous integration

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  core:
    name: ${{ matrix.compiler }} / native
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    env:
      CC: ${{ matrix.compiler }}
    steps:
      - uses: actions/checkout@v4
      - name: Install compiler
        if: matrix.compiler == 'clang'
        run: sudo apt-get update && sudo apt-get install -y clang
      - name: Build and test
        run: make test

  quality:
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: [test-sanitize, test-security]
    steps:
      - uses: actions/checkout@v4
      - name: Run quality check
        run: make ${{ matrix.check }}

  arm64:
    name: gcc / arm64 runtime
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        run: make test
      - name: Run benchmark (informational)
        run: make benchmark

  armv7-qemu:
    name: gcc / armv7 QEMU runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ARMv7 toolchain and emulator
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-linux-gnueabihf qemu-user
      - name: Cross-compile tests
        run: make clean && make CC=arm-linux-gnueabihf-gcc build/test_cpu build/test_platform
      - name: Run ARMv7 tests under QEMU
        run: |
          qemu-arm -L /usr/arm-linux-gnueabihf ./build/test_cpu
          qemu-arm -L /usr/arm-linux-gnueabihf ./build/test_platform

  static-analysis:
    name: cppcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Cppcheck
        run: sudo apt-get update && sudo apt-get install -y cppcheck
      - name: Analyze source and tests
        run: cppcheck --enable=warning,style,performance,portability --error-exitcode=1 --inline-suppr --std=c99 -Iinclude src tests examples bench

  deb-package:
    name: GTK4 Debian package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install GTK4 and packaging dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libgtk-4-dev dpkg-dev desktop-file-utils xvfb
      - name: Build desktop application and Debian package
        run: |
          make clean
          make test
          make test-gtk
          make test-gtk-ui
          make package-deb
      - name: Validate desktop entry and package metadata
        run: |
          desktop-file-validate packaging/debian/cpu-reader.desktop
          dpkg-deb --info build/cpu-reader_*.deb
          dpkg-deb --contents build/cpu-reader_*.deb
      - name: Install package and smoke-test installed binary
        run: |
          sudo apt-get install -y ./build/cpu-reader_*.deb
          cpu-reader --version
          cpu-reader --help
          pkg-config --modversion cpu-reader
          printf '#include <stdio.h>\n#include "cpu_diagnostics.h"\nint main(void) { cpu_diagnostic_report_t r; cpu_error_info_t e; return cpu_get_diagnostic_report(&r, &e); }\n' > /tmp/cpu-reader-consumer.c
          cc $(pkg-config --cflags cpu-reader) /tmp/cpu-reader-consumer.c $(pkg-config --libs cpu-reader) -o /tmp/cpu-reader-consumer
          /tmp/cpu-reader-consumer
          sh tests/test_gtk_ui.sh cpu-reader
      - name: Upload Debian package artifact
        uses: actions/upload-artifact@v4
        with:
          name: cpu-reader-deb
          path: build/cpu-reader_*.deb
          if-no-files-found: error
          retention-days: 14
