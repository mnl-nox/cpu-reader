name: Continuous integration

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  core:
    name: ${{ matrix.compiler }} / ${{ matrix.mode }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        mode: [native, portable]
    env:
      CC: ${{ matrix.compiler }}
    steps:
      - uses: actions/checkout@v4
      - name: Install compiler
        if: matrix.compiler == 'clang'
        run: sudo apt-get update && sudo apt-get install -y clang
      - name: Build and test
        run: |
          if [ "${{ matrix.mode }}" = "portable" ]; then
            make test-portable
          else
            make test
          fi
